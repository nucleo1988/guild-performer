name: Build Syncer

on:
  push:
    tags:
      - 'v*'
    paths:
      - 'syncer/**'
      - '.github/workflows/build-syncer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build exe
        working-directory: syncer/app
        run: |
          python -m pip install -r requirements.txt
          python -m PyInstaller --noconfirm GuildPerformerSync.spec

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc syncer\installer\GuildPerformerSync.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GuildPerformerSync-windows
          path: |
            syncer/app/dist/GuildPerformerSync.exe
            syncer/dist-installer/*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            syncer/app/dist/GuildPerformerSync.exe
            syncer/dist-installer/GuildPerformerSync-Setup-*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
